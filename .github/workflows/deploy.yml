name: Deploy Widget

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    name: Deploy Widget
    runs-on: self-hosted
    steps:
      - name: Run deployment script
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ./deploy.sh widget
          elif [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            ./deploy.sh staging-widget
          fi
        working-directory: /home/ghrunner/swift-agents-prod
