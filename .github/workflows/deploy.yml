name: Deploy Widget

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy-widget:
    name: Deploy Widget
    runs-on: self-hosted

    steps:
      - name: Deploy Production Widget
        if: github.ref == 'refs/heads/main'
        run: ./deploy.sh widget
        working-directory: /home/ghrunner/swift-agents-prod

      - name: Deploy Staging Widget
        if: github.ref == 'refs/heads/staging'
        run: ./deploy.sh widget-staging
        working-directory: /home/ghrunner/swift-agents-prod
